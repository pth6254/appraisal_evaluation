services:

  # ────────────────────────────────────────────
  #  pgvector — PostgreSQL + pgvector 익스텐션
  # ────────────────────────────────────────────
  pgvector:
    image: ankane/pgvector:latest
    container_name: property_concierge_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: real_estate_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_estate_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ────────────────────────────────────────────
  #  Redis — 작업 큐 상태 · 레이트 리밋 · 로그인 잠금 카운터
  #  (이전에는 셋 다 API 프로세스 메모리에 있어 멀티 워커에서 상태가 갈렸다)
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: property_concierge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ────────────────────────────────────────────
  #  FastAPI 백엔드
  # ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: property_concierge_backend:latest
    container_name: property_concierge_backend
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # app 테이블(auth/history/activity/cache/transactions/chat_corpus)과
      # RAG 벡터스토어(real_estate_docs)가 같은 pgvector 컨테이너를 공유한다.
      DATABASE_URL: postgresql://postgres:password@pgvector:5432/real_estate_db
      PG_CONNECTION_STRING: postgresql://postgres:password@pgvector:5432/real_estate_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./api:/app/api
      - ./schemas:/app/schemas
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ────────────────────────────────────────────
  #  Next.js 프론트엔드
  # ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: property_concierge_frontend:latest
    container_name: property_concierge_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  pgvector_data:
  redis_data:
